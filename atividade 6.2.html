
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>6a Display</title>

    <style>
        .container {
            background-color: lightblue;
            width: 300px;
            padding: 10px;
        }

        .caixa {
            height: 55px;
            text-align: center;
            padding-top: 20px;
            box-sizing: border-box;
        }

        .um { background-color: #6600ff; }
        .dois { background-color: green; }
        .tres { background-color: red; }
        .quatro { background-color: yellow; }
    </style>
</head>
<body>

<div class="container">
    <div class="caixa um">1</div>
    <div class="caixa dois">2</div>
    <div class="caixa tres">3</div>
    <div class="caixa quatro">4</div>
</div>
  <!--  Os elementos ficam lado a lado porque o display: flex organiza os itens horizontalmente dentro do contêiner.-->
</body>
</html>
