
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>6c Display</title>

    <style>
        .container {
            position: relative;
            background-color: white;
            width: 230px;
            height: 240px;
        }

        .caixa {
            position: absolute;
            width: 50px;
            height: 50px;
        }

        .um {
            background-color: red;
            top: 0;
            left: 0;
        }

        .dois {
            background-color: yellow;
            top: 0;
            right: 0;
        }

        .tres {
            background-color: blue;
            bottom: 0;
            left: 0;
        }

        .quatro {
            background-color: green;
            bottom: 0;
            right: 0;
        }

        .cinco {
            background-color: magenta;
            top: 40%;
            left: 40%;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="caixa um">1</div>
    <div class="caixa dois">2</div>
    <div class="caixa tres">4</div>
    <div class="caixa quatro">3</div>
    <div class="caixa cinco">5</div>
</div>
  <!-- O position: relative define o contêiner como referência. Já o position: absolute 
   permite posicionar cada quadrado individualmente usando top, bottom, left e right.-->
      
</body>
</html>
