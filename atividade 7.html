
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Chat</title>

    <style>
        
        body {
            font-family: Georgia, serif;
        }

        
        .chat {
            width: 360px;
            height: 460px;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            margin: 50px auto;
            overflow-y: auto;
        }

        
        .nome {
            color: gray;
            font-size: 12px;
            margin-left: 10px;
        }

      
        .mensagem {
            position: relative;
            min-height: 40px;
            padding: 12px;
            margin-bottom: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            overflow: auto;
        }

       
        .recebida {
            background-color: white;
        }

       
        .enviada {
            background-color: #ccffcc;
            text-align: right;
        }

        
        .avatar {
            font-size: 25px;
            float: left;
            margin-right: 15px;
        }

       
        .avatar-eu {
            float: right;
            margin-left: 15px;
        }

       
        .horario {
            position: absolute;
            bottom: 3px;
            right: 10px;
            color: gray;
            font-size: 11px;
        }

        /* Área de digitação */
        .entrada {
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 10px;
        }

        textarea {
            width: 95%;
            height: 65px;
            resize: none;
            padding: 8px;
        }

       
        button {
            float: right;
            margin-top: 5px;
        }

        .entrada::after {
            content: "";
            display: block;
            clear: both;
        }

    </style>
</head>

<body>

    
    <div class="chat">

        
        <div class="nome">Pedro Silva</div>
        <div class="mensagem recebida">
            <span class="avatar">👨🏻</span>
            Olá, tudo bem?
            <span class="horario">00:50</span>
        </div>

       
        <div class="nome">Eu</div>
        <div class="mensagem enviada">
            <span class="avatar avatar-eu">👩🏻</span>
            Estou bem sim, e você?
            <span class="horario">00:55</span>
        </div>

       
        <div class="nome">Pedro Silva</div>
        <div class="mensagem recebida">
            <span class="avatar">👨🏻</span>
            Vamos sair hoje? sabe conversar e Lorem ipsum dolor sit amet consectetur adipisicing elit.
            <span class="horario">01:01</span>
        </div>

       
        <div class="nome">Eu</div>
        <div class="mensagem enviada">
            <span class="avatar avatar-eu">👩🏻</span>
            Criatura .......
            <span class="horario">00:55</span>
        </div>

       
        <div class="entrada">
            <textarea placeholder="Digite sua mensagem"></textarea>
            <button>Enviar</button>
        </div>

    </div>

</body>
</html>
