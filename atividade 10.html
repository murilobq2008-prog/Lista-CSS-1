
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Barquinho no Mar</title>

    <style>

        
        * {
            margin: 0;
            padding: 0; 
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        
        .cena {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;

            background: linear-gradient(
                to bottom,
                #87ceeb,
                #d6f3ff
            );
        }

       

        
        .nuvem {
            width: 100px;
            height: 35px;
            background-color: white;
            border-radius: 30px;
            position: absolute;
            top: 100px;
            left: -120px;

            box-shadow:
                20px -20px 0 5px white,
                50px -15px 0 0 white,
                75px 0 0 0 white;

            animation: moverNuvem 25s linear infinite;
        }

        
        @keyframes moverNuvem {
            from {
                left: -150px;
            }

            to {
                left: 110%;
            }
        }

        
        .mar {
            width: 100%;
            height: 40%;
            position: absolute;
            bottom: 0;
            background: linear-gradient(
                to bottom,
                #168ac0,
                #004c87
            );
            z-index: 1;
        }

       
        .mar::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 60px;
            top: -30px;
            left: -50%;

            background: radial-gradient(
                ellipse,
                #168ac0 50%,
                transparent 55%
            );

            background-size: 100px 60px;

            animation: onda1 5s linear infinite;
        }

        .mar::after {
            content: "";
            position: absolute;
            width: 200%;
            height: 50px;
            top: -20px;
            left: -50%;

            background: radial-gradient(
                ellipse,
                #45b6df 40%,
                transparent 50%
            );

            background-size: 130px 50px;

            animation: onda2 7s linear infinite;
        }

       
        @keyframes onda1 {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(100px);
            }
        }

        @keyframes onda2 {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-100px);
            }
        }

        
        .barco {
            width: 150px;
            height: 120px;
            position: absolute;
            top: 48%;
            left: -180px;
            z-index: 2;

            
            background-image: linear-gradient(
                to bottom,
                transparent 0 65%,
                #8b4513 65% 100%
            );

            animation:
                navegar 15s linear infinite,
                balancar 2s ease-in-out infinite;
        }

        
        .barco::before {
            content: "";
            position: absolute;
            top: 0;
            left: 65px;

            width: 5px;
            height: 75px;
            background-color: #5c3317;
        }

       
        .barco::after {
            content: "";
            position: absolute;
            top: 5px;
            left: 15px;

            width: 55px;
            height: 65px;
            background-color: white;

            clip-path: polygon(100% 0, 100% 100%, 0 100%);
        }

        
        @keyframes navegar {
            from {
                left: -180px;
            }

            to {
                left: 110%;
            }
        }

       
        @keyframes balancar {
            0%, 100% {
                rotate: -3deg;
            }

            50% {
                rotate: 3deg;
            }
        }

    </style>
</head>

<body>

   
    <div class="cena">


     
        <div class="nuvem"></div>

        
        <div class="barco"></div>

        <div class="mar"></div>

    </div>

</body>
</html>
